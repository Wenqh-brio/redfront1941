; RedFront1941 - DefaultInput.ini
; ---------------------------------------------------------------------------
; Enhanced Input is the runtime path (RFPlayerController binds IMC_RF_Gameplay
; actions from Content/RedFront/Blueprints/Input). The legacy axis/action
; mappings below are kept as a fallback so a fresh checkout can be driven by a
; keyboard/mouse before the Input Actions and Input Mapping Context assets are
; authored, and so the mapping names are documented in one place.
;
; Aim is a 2D screen position (mouse cursor) which RFPlayerController
; deprojects onto the gameplay plane at Z = 0 (see MouseToWorldOnPlane).
; Grenade_Throw uses hold-to-cook: Press starts the fuse countdown, Release throws.
; ---------------------------------------------------------------------------

[/Script/Engine.InputSettings]
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True
bUseMouseForTouch=False
bEnableMouseSmoothing=False
bEnableFOVScaling=False
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
bDefaultViewportMouseLock=True
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
DefaultTouchInterface=None

; ------------------------------ Enhanced Input ------------------------------
; Gameplay context: IMC_RF_Gameplay is pushed on possess, IMC_RF_Support while
; the support/radio wheel is open, IMC_RF_Map while the map board is open.
[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
bEnableUserSettings=True
bEnableDefaultMappingContexts=True
bShouldOnlyTriggerWhenInputModeIsGameAndMouseCaptured=True

; ------------------------------- Axis moves --------------------------------
; Move is a 2D vector on the gameplay plane: X = screen right (East), Y = screen up (North).
+AxisMappings=(AxisName="Move",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="Move",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="Move",Scale=1.000000,Key=Up)
+AxisMappings=(AxisName="Move",Scale=-1.000000,Key=Down)
; Two extra axes resolve the full 2D vector without an Input Action asset.
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=Left)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=Right)
+; Mouse cursor position in viewport space (0-1); combined with MoveRight this
+; gives the 2D vector used by the legacy path.
+AxisMappings=(AxisName="AimX",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="AimY",Scale=-1.000000,Key=MouseY)
+; Gamepad: left stick moves, right stick aims (radial deadzone applied in code).
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=Gamepad_LeftX)
+AxisMappings=(AxisName="Move",Scale=-1.000000,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="AimX",Scale=1.000000,Key=Gamepad_RightX)
+AxisMappings=(AxisName="AimY",Scale=-1.000000,Key=Gamepad_RightY)
; Support radio tuning / map pan / zoom use the same axes under a different context.
+AxisMappings=(AxisName="MapZoom",Scale=1.000000,Key=MouseWheelAxis)

; ------------------------------ Action names --------------------------------
