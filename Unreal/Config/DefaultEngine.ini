; RedFront1941 - DefaultEngine.ini
; High-resolution 2D (Paper2D / PaperZD) WWII squad shooter.
; Rendering notes:
;   * Gameplay runs on the XY plane; the camera is a fixed Orthographic view, so the
;     renderer keeps a deferred pipeline (Lumen for the dim, moody 1941-45 lighting)
;     while gameplay code never relies on 3D depth sorting.
;   * Anti-aliasing is TSR (r.DefaultFeature.AntiAliasing=2). TSR needs a temporally
;     stable image: keep sprite materials opaque and mask, avoid alpha-test dithering.
;     For crisp hand-painted sprites in a cinematic, set r.AntiAliasingMethod=2 and
;     turn on r.TSR.History.ScreenPercentage=200 in a device profile.
;   * Texture streaming pool is raised because sprite atlases for 56 levels plus
;     8-direction flipbooks are large (4096+ sheets).

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/RedFront/Levels/C01_Barbarossa_1941/LV_SOV_01_BrestFortress.LV_SOV_01_BrestFortress
EditorStartupMap=/Game/RedFront/Levels/C01_Barbarossa_1941/LV_SOV_01_BrestFortress.LV_SOV_01_BrestFortress
GlobalDefaultGameMode=/Script/RedFront1941.RFGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.RendererSettings]
; --- Anti-aliasing: 2 = TSR (Temporal Super Resolution) ---
r.DefaultFeature.AntiAliasing=2
r.AntiAliasingMethod=2
; TSR history for 2D: full-resolution history keeps painted edges stable on pan.
r.TSR.History.ScreenPercentage=100
r.TSR.ShadingRejection.Flickering=1
; Sprites are flat and unlit-friendly, but the 2D scene uses deferred decals for
; ground scorch, so keep GBuffer formats at the engine default.
r.GBufferFormat=1
; --- Lighting ---
; Lumen GI/reflections: on, but at "2D-friendly" quality because the camera is ortho
; and only a thin slice of the world is ever visible.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.Lumen.ScreenProbeGather.RadianceCache=1
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=0
; --- Shadows ---
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=0.0
; Paper2D sprites are unlit by default; when a level uses lit sprites, disable
; per-sprite shadow casting in the sprite asset instead of globally.
r.Shadow.CSM.MaxCascades=2
; --- Sky / atmosphere ---
r.DefaultFeature.AutoExposure=0
r.DefaultFeature.MotionBlur=1
r.DefaultFeature.Bloom=1
r.DefaultFeature.AmbientOcclusion=1
r.DefaultFeature.AmbientOcclusionStaticFraction=0
; --- Nanite / LOD ---
; Nanite stays off: 2D art is sprite geometry, Nanite would only add cost.
r.Nanite.ProjectEnabled=0
r.Mobile.EnableStaticAndCSMShadowReceivers=1
; --- Texture streaming for large sprite atlases ---
r.Streaming.PoolSize=3000
r.Streaming.LimitPoolSizeToVRAM=0
r.Streaming.MaxEffectiveScreenSize=0
r.Streaming.HLODStrategy=2
r.Streaming.DefragDynamicBounds=1
r.Streaming.FullyLoadUsedTextures=0
r.Streaming.Boost=1.0
; Sprite atlases are authored as sRGB power-of-two sheets with no mip-generation
; artifacts at ortho zoom levels; keep texture filtering sharp by default.
r.Texture.DefaultFilter=1
r.MipMapLODBias=0
; --- Viewport / presentation ---
r.DefaultFeature.LensFlare=0
r.CustomDepth=3
r.AllowStaticLighting=0
r.ScreenPercentage=100
r.Upscale.Quality=3
; --- Performance ---
r.VSync=1
r.FrameRateLimit=0
; The gameplay layer must be frame-rate independent: no fixed frame rate, but
; smoothing stays on so the 2D camera pans do not judder.
bUseFixedFrameRate=False
bSmoothFrameRate=True
SmoothedFrameRateRange=(LowerBound=(Type="ERangeBoundTypes::Inclusive",Value=30),UpperBound=(Type="ERangeBoundTypes::Exclusive",Value=144))

[/Script/Engine.PhysicsSettings]
; 2D-plane gameplay collision contract:
;   * Gameplay actors live on the XY plane and are separated only by collision
;     profiles that ignore Z. The project profile "RF_2DSprite" blocks
;     WorldStatic/WorldDynamic and the custom "RFPlane" channel, and overlaps
;     everything else.
;   * Bullets travel as short traces along the plane, so "RF_Projectile" blocks
;     RF_Plane + WorldStatic and ignores Pawn (the ballistics code decides hits).
DefaultGravityZ=-980.000000
bEnableEnhancedDeterminism=True
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=4
; NOTE (collision profile contract, authored in the editor):
;   RF_2DSprite      : ObjectType=Pawn,   Block WorldStatic/WorldDynamic/RFPlane, Overlap RF_Projectile
;   RF_Plane         : ObjectType=WorldStatic, Block Pawn/RF_Projectile, Overlap RF_Sprite
;   RF_Projectile    : ObjectType=WorldDynamic, Block RF_Plane/WorldStatic, Overlap Pawn/RF_Sprite
;   RF_Interactable  : ObjectType=WorldDynamic, Overlap Pawn only

[/Script/Engine.CollisionProfile]
; Object channels first: the 2D sprite profile and the ballistic trace profile are custom
; object types, then the two game trace channels the profile table below refers to.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=True,bStaticObject=False,Name="RF_Projectile")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=True,Name="RF_Plane")
+Profiles=(Name="RF_2DSprite",CollisionEnabled=QueryAndPhysics,ObjectTypeName="Pawn",CustomResponses=((Channel="WorldStatic",Response=ECR_Block),(Channel="WorldDynamic",Response=ECR_Block),(Channel="RF_Plane",Response=ECR_Block),(Channel="RF_Projectile",Response=ECR_Overlap)),HelpMessage="2D sprite actor: blocks the gameplay plane and terrain, overlaps projectiles.")
+Profiles=(Name="RF_Plane",CollisionEnabled=QueryOnly,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Pawn",Response=ECR_Block),(Channel="RF_Projectile",Response=ECR_Block)),HelpMessage="2D gameplay plane / level bounds.")
+Profiles=(Name="RF_Projectile",CollisionEnabled=QueryOnly,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="WorldStatic",Response=ECR_Block),(Channel="RF_Plane",Response=ECR_Block),(Channel="Pawn",Response=ECR_Overlap)),HelpMessage="Ballistic trace channel owner; damage resolved by RFBallistics.")
+Profiles=(Name="RF_Interactable",CollisionEnabled=QueryOnly,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Pawn",Response=ECR_Overlap)),HelpMessage="Pickups, resupply crates, radios.")

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/RedFront1941")

[/Script/EngineSettings.GeneralProjectSettings]
bUseSplitscreen=False
bAllowWindowResize=True

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
