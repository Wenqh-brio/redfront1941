DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
Compiler=Default
AudioMixerSampleRate=48000
bAllowDirectX11Fallback=True

[/Script/Engine.UserInterfaceSettings]
RenderFocusRule=Never
ApplicationScale=1.000000
UIScaleRule=ShortestSide
UIScaleCurve=(EditorCurveData=(Keys=((Time=480.000000,Value=1.000000),(Time=720.000000,Value=1.000000))),ExternalCurve=None)

[/Script/Paper2D.PaperRuntimeSettings]
; Sprite pivot and material defaults used by the 2D art pipeline:
;   * Baked pivot at bottom-center of the sprite (feet), so a flipbook's frames
;     line up on the gameplay plane without per-frame offset.
;   * Default sprite material is Masked (crisp alpha edges under TSR) and unlit.
DefaultPivotPoint=(X=0.500000,Y=1.000000)
DefaultSpriteTextureFilter=TF_Bilinear

